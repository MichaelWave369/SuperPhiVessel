name: github-pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/vessie-web/**"
      - "windows-starter/**"
      - "protocols/dlam-v0.1/genius-roster.json"
      - "protocols/routing-v2/model-candidates.json"
      - "runtime/MANIFEST.json"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  pages-enabled:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::Enable Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          fi

  deploy:
    if: needs.pages-enabled.outputs.enabled == 'true'
    needs: pages-enabled
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node for React cockpit
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install cockpit dependencies
        working-directory: apps/vessie-web
        run: npm install --no-audit --no-fund

      - name: Test React cockpit source
        working-directory: apps/vessie-web
        run: npm test

      - name: Build /vessie/ into existing static site
        working-directory: apps/vessie-web
        run: npm run build

      - name: Build downloadable Windows starter archive
        shell: bash
        run: |
          python3 windows-starter/build-package.py
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          path=Path('site/downloads/SuperPhiVessel-Windows-Starter.zip')
          with ZipFile(path) as z:
              assert z.namelist()==['START_HERE.txt','Start-Vessie.cmd','Start-Vessie.ps1']
              assert z.testzip() is None
          assert Path('site/starter/index.html').is_file()
          print('windows-starter-pages-download: PASS')
          PY

      - name: Verify existing front door and searchable manual preserved
        shell: bash
        run: |
          test -f site/index.html
          test -f site/manual/index.html
          test -f site/vessie/index.html
          grep -q '/SuperPhiVessel/vessie/' site/vessie/index.html
          echo 'existing-site-and-react-cockpit: PASS'

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
