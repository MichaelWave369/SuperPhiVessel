name: github-pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/vessie-web/**"
      - "windows-starter/**"
      - "windows-local/**"
      - "packages/vessie-local-console/**"
      - "packages/vessie-gateway-v0.1/ollama-probe.mjs"
      - "protocols/dlam-v0.1/genius-roster.json"
      - "protocols/routing-v2/model-candidates.json"
      - "runtime/MANIFEST.json"
      - ".github/workflows/github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  pages-enabled:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages not enabled::Enable Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          fi

  build-windows-local-console:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test local read-only service contracts
        run: node --test packages/vessie-local-console/tests/*.test.mjs
      - name: Build self-contained Windows ZIP with Node runtime and license
        shell: pwsh
        run: |
          .\\windows-local\\build-portable.ps1 -OutputPath (Join-Path $env:RUNNER_TEMP 'SuperPhiVessel-Local-Console-Windows.zip')
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'PORTABLE_BUILD_BLOCKED' }
          $zip=Join-Path $env:RUNNER_TEMP 'SuperPhiVessel-Local-Console-Windows.zip'
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'PORTABLE_ZIP_MISSING' }
          if ((Get-Item $zip).Length -gt 104857600) { throw 'PORTABLE_ZIP_TOO_LARGE' }
      - uses: actions/upload-artifact@v4
        with:
          name: vessie-windows-local-console
          path: ${{ runner.temp }}/SuperPhiVessel-Local-Console-Windows.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    if: needs.pages-enabled.outputs.enabled == 'true'
    needs: [pages-enabled, build-windows-local-console]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node for React cockpit
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install cockpit dependencies
        working-directory: apps/vessie-web
        run: npm install --no-audit --no-fund

      - name: Test React cockpit source
        working-directory: apps/vessie-web
        run: npm test

      - name: Build /vessie/ into existing static site
        working-directory: apps/vessie-web
        run: npm run build

      - name: Stamp deployed cockpit provenance for post-deploy browser verification
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,readFileSync,existsSync} from 'node:fs';
          import {resolve} from 'node:path';
          const file=resolve('site/vessie/deploy-provenance.json');
          if(!existsSync('site/vessie/index.html'))throw Error('COCKPIT_BUILD_MISSING');
          const sha=process.env.GITHUB_SHA;
          const runId=process.env.GITHUB_RUN_ID;
          if(!/^[0-9a-f]{40}$/.test(sha||'')||!/^[0-9]+$/.test(runId||'')){
            throw Error('PAGES_PROVENANCE_ENV_INVALID');
          }
          const proof={
            schema:'superphivessel.pages-deploy-provenance.v0.1',
            repo:process.env.GITHUB_REPOSITORY,
            commitSha:sha,
            workflowRunId:runId,
            cockpitPath:'/SuperPhiVessel/vessie/',
            provenance:'GITHUB_ACTIONS_REPORTED_BUILD_REVISION',
            deployedBrowserVerified:false,
            independentlyAttestedExternalDone:false
          };
          const htmlFile=resolve('site/vessie/index.html');
          const html=readFileSync(htmlFile,'utf8');
          if(!html.includes('</head>'))throw Error('COCKPIT_HEAD_MISSING');
          writeFileSync(htmlFile,html.replace('</head>',
            '<meta name="spv-pages-build-sha" content="'+sha+'"></head>'));
          writeFileSync(file,JSON.stringify(proof)+'\n');
          console.log('pages-provenance-generated: '+sha+' run '+runId);
          NODE

      - name: Build downloadable Windows starter archive
        shell: bash
        run: |
          python3 windows-starter/build-package.py
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          path=Path('site/downloads/SuperPhiVessel-Windows-Starter.zip')
          with ZipFile(path) as z:
              assert z.namelist()==['START_HERE.txt','Start-Vessie.cmd','Start-Vessie.ps1']
              assert z.testzip() is None
          assert Path('site/starter/index.html').is_file()
          print('windows-starter-pages-download: PASS')
          PY

      - name: Retrieve built local Windows console ZIP for public downloads
        uses: actions/download-artifact@v4
        with:
          name: vessie-windows-local-console
          path: site/downloads

      - name: Verify local console downloadable artifact
        shell: bash
        run: |
          test -s site/downloads/SuperPhiVessel-Local-Console-Windows.zip
          test -f site/local/index.html
          python3 - <<'PY'
          from zipfile import ZipFile
          z=ZipFile('site/downloads/SuperPhiVessel-Local-Console-Windows.zip')
          names={n.replace('\\','/') for n in z.namelist() if not n.endswith('/')}
          required={'node.exe','LICENSE.node.txt','START_HERE.txt','Start-Local-Vessie.cmd','Start-Local-Trial.cmd',
                    'server.mjs','ollama-probe.mjs','trial-runner.mjs','ui/index.html','ui/style.css','ui/app.js','ui/review-evidence.mjs','ui/evidence-bench.mjs','ui/portable-bench.mjs','ui/trial-protocols.mjs','ui/protocol-cohorts.mjs','ui/human-review-guides.mjs'}
          assert names == required, (names-required,required-names)
          assert z.testzip() is None
          print('windows-local-console-pages-download: PASS')
          PY

      - name: Verify existing front door and searchable manual preserved
        shell: bash
        run: |
          test -f site/index.html
          test -f site/manual/index.html
          test -f site/vessie/index.html
          grep -q '/SuperPhiVessel/vessie/' site/vessie/index.html
          echo 'existing-site-and-react-cockpit: PASS'

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
