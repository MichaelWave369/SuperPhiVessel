name: core-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical runtime SHA-256
        shell: bash
        run: |
          echo "3dbf3dc162196dfcb1561563f2b61c45ba5c4f88b5566844cdf75e8d16cfc81d  runtime/Super_PhiVessel_v2.0-alpha.11.0.54.8_Blank_State_Hardening.html" | sha256sum --check -

      - name: Verify runtime version marker
        shell: bash
        run: |
          grep -Fq "v2.0-alpha.11.0.54.8 — Blank-State Release Hardening" runtime/Super_PhiVessel_v2.0-alpha.11.0.54.8_Blank_State_Hardening.html

      - name: Verify blank-state public data epoch
        run: node tests/blank-state.test.js

  spdw-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SPD-W frozen acceptance contract
        working-directory: packages/spdw-v0.1
        run: node spdw-v0.1.acceptance.js
