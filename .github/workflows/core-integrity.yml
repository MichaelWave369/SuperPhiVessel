name: core-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical runtime from manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const m = JSON.parse(fs.readFileSync('runtime/MANIFEST.json', 'utf8'));
          const bytes = fs.readFileSync(m.runtime.path);
          const digest = crypto.createHash('sha256').update(bytes).digest('hex');
          if (digest !== m.runtime.sha256) throw new Error('canonical SHA-256 mismatch');
          if (bytes.length !== m.runtime.size_bytes) throw new Error('canonical size mismatch');
          const html = bytes.toString('utf8');
          const version = String(m.runtime.version || '').replace(/^v/, '');
          if (!html.includes("const SUPER_PHIVESSEL_VERSION='" + version + "';")) throw new Error('runtime version marker mismatch');
          console.log('canonical-runtime: PASS · ' + m.runtime.version + ' · ' + digest);
          NODE

      - name: Verify blank-state public data epoch
        run: node tests/blank-state.test.js

      - name: Verify Service / Models render contract
        run: node tests/service-models-render.test.js

      - name: Verify PV-DLAM-0.1 contract
        run: node tests/dlam-v0.1.contract.test.js

      - name: Verify GA108 stable roster
        run: node tests/ga108-roster.test.js

  dlam-p1a-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PV-DLAM P1-A single-node continuity acceptance
        run: python3 packages/dlam-p1-v0.1/acceptance.py

  dlam-p1b-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PV-DLAM P1-B governed context acceptance
        run: python3 packages/dlam-p1-v0.1/context_acceptance.py

  dlam-p1c-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PV-DLAM P1-C routing and model-swap acceptance
        run: python3 packages/dlam-p1-v0.1/p1c_acceptance.py

  dlam-p1d-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PV-DLAM P1-D durability and recovery acceptance
        run: python3 packages/dlam-p1-v0.1/p1d_acceptance.py

  sparse-frontier-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Sparse Frontier Routing v0.1 acceptance
        run: python3 packages/sparse-frontier-v0.1/acceptance.py

  spdw-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SPD-W frozen acceptance contract
        working-directory: packages/spdw-v0.1
        run: node spdw-v0.1.acceptance.js
