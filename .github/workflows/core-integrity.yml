name: core-integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vessie-r3e-operator-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify operator-signed offline evidence envelope and negative controls
        run: node --test packages/vessie-gateway-v0.1/canonical-routes/tests/operator-envelope.test.mjs

  vessie-r3c-native-route-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical route evidence projection and negative controls
        run: node --test packages/vessie-gateway-v0.1/canonical-routes/tests/projector.test.mjs

  vessie-r3b-brainc-donor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test BrainC donor configured-state versus executed-model separation
        run: node --test packages/vessie-gateway-v0.1/brainc-donor/tests/config-probe.test.mjs

  vessie-r3a-trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline route trace source and authority refusals
        run: python3 packages/vessie-gateway-v0.1/r3a_acceptance.py

  vessie-r2-field-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify redacted field assessment contract
        run: node --test packages/vessie-gateway-v0.1/pilots/assess-field.test.mjs
      - name: Parse PowerShell field script without changing Windows TLS settings
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('packages/vessie-gateway-v0.1/pilots/Windows-R2-LocalTrust.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'field script syntax: PASS; no local gateway claim made'
  vessie-gateway-r2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTTPS certificate fixtures and browser pairing contract
        run: node --test packages/vessie-gateway-v0.1/tests/browser-pairing.test.mjs

  vessie-gateway-r1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove local-only discovery auth and refusal controls
        run: npm test --prefix packages/vessie-gateway-v0.1

  vessie-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React cockpit dependencies
        working-directory: apps/vessie-web
        run: npm install --no-audit --no-fund
      - name: Test local-only evidence inspector
        working-directory: apps/vessie-web
        run: npm test
      - name: Build Vessie GitHub Pages cockpit
        working-directory: apps/vessie-web
        run: npm run build
      - name: Confirm canonical runtime untouched and site output isolated
        shell: bash
        run: |
          test -f site/vessie/index.html
          test -f site/index.html
          test -f site/manual/index.html
          node -e "const x=require('./runtime/MANIFEST.json'); if(x.runtime.version !== 'v2.0-alpha.11.0.54.12') process.exit(1)"
  runtime-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical runtime from manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const m = JSON.parse(fs.readFileSync('runtime/MANIFEST.json', 'utf8'));
          const bytes = fs.readFileSync(m.runtime.path);
          const digest = crypto.createHash('sha256').update(bytes).digest('hex');
          if (digest !== m.runtime.sha256) throw new Error('canonical SHA-256 mismatch');
          if (bytes.length !== m.runtime.size_bytes) throw new Error('canonical size mismatch');
          const html = bytes.toString('utf8');
          const version = String(m.runtime.version || '').replace(/^v/, '');
          if (!html.includes("const SUPER_PHIVESSEL_VERSION='" + version + "';")) throw new Error('runtime version marker mismatch');
          console.log('canonical-runtime: PASS · ' + m.runtime.version + ' · ' + digest);
          NODE

      - name: Verify blank-state public data epoch
        run: node tests/blank-state.test.js

      - name: Verify Service / Models render contract
        run: node tests/service-models-render.test.js

      - name: Verify PV-DLAM-0.1 contract
        run: node tests/dlam-v0.1.contract.test.js

      - name: Verify GA108 stable roster
        run: node tests/ga108-roster.test.js

  dlam-p1a-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PV-DLAM P1-A single-node continuity acceptance
        run: python3 packages/dlam-p1-v0.1/acceptance.py

  dlam-p1b-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PV-DLAM P1-B governed context acceptance
        run: python3 packages/dlam-p1-v0.1/context_acceptance.py

  dlam-p1c-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run PV-DLAM P1-C routing and model-swap acceptance
