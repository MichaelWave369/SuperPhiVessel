name: PhiBot Physical Observer Canonical Candidate

on:
  pull_request:
    paths:
      - 'packages/phibot-physical-observer-v0.2/**'
      - 'packages/phibot-physical-observer-v0.3/**'
      - 'scripts/build-phibot-physical-observer-candidate-v0.3.mjs'
      - 'packages/README.md'
      - 'tests/README.md'
      - '.github/workflows/phibot-physical-observer-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout pinned NBG producer
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/NestedBubbleGear
          ref: 7b5cb309fcd2af409de6f8676cc074c395a666b4
          path: _nbg

      - name: Test browser-native runtime seam and replay isolation
        env:
          NBG_ROOT: ${{ github.workspace }}/_nbg
        run: node packages/phibot-physical-observer-v0.2/acceptance.mjs

      - name: Build isolated standalone HTML candidate
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-phibot-physical-observer-candidate-v0.3.mjs \
            "$RUNNER_TEMP/Super_PhiVessel_v2.0-alpha.11.0.54.13_Physical_Observer_Candidate.html"

      - name: Smoke-test generated candidate and canonical preservation
        shell: bash
        run: |
          set -euo pipefail
          node packages/phibot-physical-observer-v0.3/acceptance.mjs \
            "$RUNNER_TEMP/Super_PhiVessel_v2.0-alpha.11.0.54.13_Physical_Observer_Candidate.html"

      - name: Upload candidate for operator review
        uses: actions/upload-artifact@v4
        with:
          name: PhiBot-Physical-Observer-54-13-Candidate
          path: |
            ${{ runner.temp }}/Super_PhiVessel_v2.0-alpha.11.0.54.13_Physical_Observer_Candidate.html
            ${{ runner.temp }}/Super_PhiVessel_v2.0-alpha.11.0.54.13_Physical_Observer_Candidate.html.build.json
          if-no-files-found: error
          retention-days: 14
