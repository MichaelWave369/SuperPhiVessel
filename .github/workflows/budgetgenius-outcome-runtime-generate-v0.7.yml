name: budgetgenius-outcome-runtime-generate-v0.7

on:
  push:
    branches:
      - feat/budgetgenius-outcome-handoff-v0-7
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-test-and-pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Super Phi.Vessel branch
        uses: actions/checkout@v4
        with:
          ref: feat/budgetgenius-outcome-handoff-v0-7
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout pinned BudgetGenius
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/BudgetGenius
          ref: 44ffc8ccd0f8eafb7130a3051215e536daaa4dce
          path: _budgetgenius

      - name: Generate canonical v0.7 runtime
        run: node scripts/build-budgetgenius-outcome-runtime-v0.7.mjs

      - name: Run v0.7 acceptance against generated runtime
        env:
          BUDGETGENIUS_ROOT: ${{ github.workspace }}/_budgetgenius
        run: node packages/budgetgenius-bridge-v0.7/acceptance.mjs

      - name: Commit pinned generated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/MANIFEST.json runtime/Super_PhiVessel_v2.0-alpha.11.0.54.12_BudgetGenius_Outcome_Handoff.html
          if git diff --cached --quiet; then
            echo "Generated runtime already pinned."
            exit 0
          fi
          git commit -m "build: pin canonical BudgetGenius outcome runtime v0.7"
          git push origin HEAD:feat/budgetgenius-outcome-handoff-v0-7
