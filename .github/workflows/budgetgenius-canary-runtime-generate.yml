name: budgetgenius-canary-runtime-reproduce

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Super Phi.Vessel
        uses: actions/checkout@v4

      - name: Checkout pinned BudgetGenius
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/BudgetGenius
          ref: 44ffc8ccd0f8eafb7130a3051215e536daaa4dce
          path: _budgetgenius

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reproduce canonical v0.5 runtime candidate
        run: node scripts/build-budgetgenius-canary-runtime-v0.5.mjs

      - name: Run v0.5 acceptance against reproduced canonical runtime
        env:
          BUDGETGENIUS_ROOT: ${{ github.workspace }}/_budgetgenius
        run: node packages/budgetgenius-bridge-v0.5/acceptance.mjs

      - name: Prove reproduction is byte-identical
        shell: bash
        run: |
          git diff --exit-code -- runtime/MANIFEST.json runtime/Super_PhiVessel_v2.0-alpha.11.0.54.11_BudgetGenius_Canary_Seam.html
