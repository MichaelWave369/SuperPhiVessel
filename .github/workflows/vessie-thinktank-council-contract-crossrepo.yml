name: vessie-thinktank-council-contract-crossrepo

on:
  pull_request:
    paths:
      - "apps/vessie-web/e2e/council-contract-crossrepo.spec.mjs"
      - "apps/vessie-web/tests/council-contract-crossrepo.node.mjs"
      - "apps/vessie-web/playwright.council-contract-crossrepo.config.mjs"
      - "apps/vessie-web/playwright.acceptance.config.mjs"
      - "apps/vessie-web/src/local-council-contract.mjs"
      - "apps/vessie-web/src/local-council-contract.d.mts"
      - "apps/vessie-web/src/ThinkTankLocalCouncilContractDesk.tsx"
      - "apps/vessie-web/src/thinktank-decision-bridge.mjs"
      - "apps/vessie-web/src/company-mode.mjs"
      - ".github/workflows/vessie-thinktank-council-contract-crossrepo.yml"
  push:
    branches: [main]
    paths:
      - "apps/vessie-web/e2e/council-contract-crossrepo.spec.mjs"
      - "apps/vessie-web/tests/council-contract-crossrepo.node.mjs"
      - "apps/vessie-web/playwright.council-contract-crossrepo.config.mjs"
      - "apps/vessie-web/playwright.acceptance.config.mjs"
      - "apps/vessie-web/src/local-council-contract.mjs"
      - "apps/vessie-web/src/local-council-contract.d.mts"
      - "apps/vessie-web/src/ThinkTankLocalCouncilContractDesk.tsx"
      - "apps/vessie-web/src/thinktank-decision-bridge.mjs"
      - "apps/vessie-web/src/company-mode.mjs"
      - ".github/workflows/vessie-thinktank-council-contract-crossrepo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-contract-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed Vessie source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable merged ThinkTank 35 CLI revision
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/think-tank
          ref: c5f1d32d1def388b675b229d338b630598c53a14
          path: think-tank
          persist-credentials: false
      - name: Verify exact ThinkTank CLI source revision
        working-directory: think-tank
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "c5f1d32d1def388b675b229d338b630598c53a14"
          test -f src/localCouncil.ts
          test -f scripts/local-council-entry.ts
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Vessie workspace
        working-directory: apps/vessie-web
        run: npm install --no-audit --no-fund
      - name: Install pinned browser runner
        working-directory: apps/vessie-web
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
      - name: Install pinned ThinkTank
        working-directory: think-tank
        run: npm install --no-audit --no-fund
      - name: Build the ACTUAL ThinkTank local council CLI
        working-directory: think-tank
        run: npm run council:build
      - name: Install real Chromium
        working-directory: apps/vessie-web
        run: npx playwright install --with-deps chromium
      - name: Human-review UI generates exact inert contract and SHA receipt
        working-directory: apps/vessie-web
        env:
          CI: "true"
        run: npx playwright test --config=playwright.council-contract-crossrepo.config.mjs
      - name: Refuse missing browser-generated bytes
        working-directory: apps/vessie-web
        shell: bash
        run: |
          test -s test-results/council-contract-crossrepo/contract.json
          test -s test-results/council-contract-crossrepo/ui-receipt.json
      - name: Actual CLI with mock-only localhost seat, replay, dossier and Vessie admission
        working-directory: apps/vessie-web
        env:
          CI: "true"
          OPENAI_API_KEY: ""
          KIMI_API_KEY: ""
          OPENAI_MODEL: ""
          KIMI_MODEL: ""
        run: node --test tests/council-contract-crossrepo.node.mjs
      - name: Preserve browser failure diagnostics ONLY
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-contract-browser-test-diagnostics
          path: |
            apps/vessie-web/test-results/**/*.png
            apps/vessie-web/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
