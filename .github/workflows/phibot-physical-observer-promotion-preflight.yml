name: PhiBot Physical Observer Promotion Preflight

on:
  pull_request:
    paths:
      - 'docs/physical-observer/**'
      - 'packages/phibot-physical-observer-v0.5/**'
      - 'scripts/verify-physical-observer-promotion-v0.5.mjs'
      - '.github/workflows/phibot-physical-observer-promotion-preflight.yml'
      - 'packages/README.md'
      - 'tests/README.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regenerate-pinned-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout pinned NBG physical-handoff producer
        uses: actions/checkout@v4
        with:
          repository: MichaelWave369/NestedBubbleGear
          ref: 7b5cb309fcd2af409de6f8676cc074c395a666b4
          path: _nbg

      - name: Install pinned Playwright
        run: npm install --ignore-scripts --no-package-lock --prefix packages/phibot-physical-observer-v0.4

      - name: Install headless Chromium and required libraries
        run: packages/phibot-physical-observer-v0.4/node_modules/.bin/playwright install --with-deps chromium

      - name: Recheck observer runtime and generated candidate contracts
        shell: bash
        env:
          NBG_ROOT: ${{ github.workspace }}/_nbg
        run: |
          set -euo pipefail
          node packages/phibot-physical-observer-v0.2/acceptance.mjs
          node scripts/build-phibot-physical-observer-candidate-v0.3.mjs \
            "$RUNNER_TEMP/Physical_Observer_54_13_Qualified_Candidate.html"
          node packages/phibot-physical-observer-v0.3/acceptance.mjs \
            "$RUNNER_TEMP/Physical_Observer_54_13_Qualified_Candidate.html"

      - name: Produce signed-format fixtures with real pinned NBG
        env:
          NBG_ROOT: ${{ github.workspace }}/_nbg
        run: |
          node packages/phibot-physical-observer-v0.4/make-browser-fixtures.mjs \
            "$RUNNER_TEMP/physical-observer-qualification"

      - name: Run real Chromium browser qualification
        env:
          CI: '1'
        run: |
          node packages/phibot-physical-observer-v0.4/browser-qualification.mjs \
            "$RUNNER_TEMP/Physical_Observer_54_13_Qualified_Candidate.html" \
            "$RUNNER_TEMP/physical-observer-qualification/observer-browser-fixtures.json" \
            "$RUNNER_TEMP/physical-observer-qualification"

      - name: Upload reviewed HTML and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhiBot-Physical-Observer-Promotion-Current-Evidence
          path: |
            ${{ runner.temp }}/Physical_Observer_54_13_Qualified_Candidate.html
            ${{ runner.temp }}/Physical_Observer_54_13_Qualified_Candidate.html.build.json
            ${{ runner.temp }}/physical-observer-qualification/observer-desktop-valid.png
            ${{ runner.temp }}/physical-observer-qualification/observer-mobile-valid.png
          if-no-files-found: error
          retention-days: 14

  promotion-preflight:
    needs: regenerate-pinned-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build pinned candidate without touching canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promotion-review"
          node scripts/build-phibot-physical-observer-candidate-v0.3.mjs \
            "$RUNNER_TEMP/promotion-review/Physical_Observer_54_13_Qualified_Candidate.html"

      # Old run 37730175204 expired. Regenerate under the exact pinned
      # NBG/Playwright workflow and compare against dossier SHA-256 pins.
      # A different screenshot MUST fail the existing promotion verifier.
      - name: Retrieve same-run Chromium screenshots (no expired cross-run dependency)
        uses: actions/download-artifact@v4
        with:
          name: PhiBot-Physical-Observer-Promotion-Current-Evidence
          path: ${{ runner.temp }}/promotion-review/qualification

      - name: Require both independently regenerated screenshot files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/promotion-review/qualification/physical-observer-qualification/observer-desktop-valid.png"
          test -f "$RUNNER_TEMP/promotion-review/qualification/physical-observer-qualification/observer-mobile-valid.png"

      - name: Verify immutable candidate/screenshot pins and generate HOLD receipt
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-physical-observer-promotion-v0.5.mjs \
            "$RUNNER_TEMP/promotion-review/Physical_Observer_54_13_Qualified_Candidate.html" \
            "$RUNNER_TEMP/promotion-review/Physical_Observer_54_13_Qualified_Candidate.html.build.json" \
            "$RUNNER_TEMP/promotion-review/qualification/physical-observer-qualification/observer-desktop-valid.png" \
            "$RUNNER_TEMP/promotion-review/qualification/physical-observer-qualification/observer-mobile-valid.png" \
            "$RUNNER_TEMP/promotion-review/PROMOTION_PREFLIGHT_HOLD.json" \
            docs/physical-observer/PROMOTION_DOSSIER_54_13.json

      - name: Exercise fail-closed tampering and approval-promotion negative controls
        shell: bash
        run: |
          set -euo pipefail
          node packages/phibot-physical-observer-v0.5/acceptance.mjs \
            "$RUNNER_TEMP/promotion-review/Physical_Observer_54_13_Qualified_Candidate.html" \
            "$RUNNER_TEMP/promotion-review/Physical_Observer_54_13_Qualified_Candidate.html.build.json" \
            "$RUNNER_TEMP/promotion-review/qualification/physical-observer-qualification/observer-desktop-valid.png" \
            "$RUNNER_TEMP/promotion-review/qualification/physical-observer-qualification/observer-mobile-valid.png"

      - name: Upload operator-review HOLD dossier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhiBot-Physical-Observer-Promotion-Preflight-HOLD
          path: |
            ${{ runner.temp }}/promotion-review/PROMOTION_PREFLIGHT_HOLD.json
            ${{ runner.temp }}/promotion-review/Physical_Observer_54_13_Qualified_Candidate.html.build.json
          if-no-files-found: warn
          retention-days: 14
