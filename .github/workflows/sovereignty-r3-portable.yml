name: Sovereignty R3 portable records R0
on:
  pull_request:
    paths:
      - 'tools/sovereignty-r3/**'
      - 'docs/SOVEREIGNTY_R3_PORTABLE_RECORDS_R0.md'
      - 'tests/sovereignty-r3-portable.test.mjs'
      - 'tests/fixtures/sovereignty-r3-synthetic-staging.json'
      - '.github/workflows/sovereignty-r3-portable.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sovereignty-r3/**'
      - 'docs/SOVEREIGNTY_R3_PORTABLE_RECORDS_R0.md'
      - 'tests/sovereignty-r3-portable.test.mjs'
      - 'tests/fixtures/sovereignty-r3-synthetic-staging.json'
      - '.github/workflows/sovereignty-r3-portable.yml'
permissions:
  contents: read
jobs:
  portable-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax preflight
        run: |
          node --check tools/sovereignty-r3/portable.mjs
          node --check tools/sovereignty-r3/reader.mjs
          node --check tools/sovereignty-r3/pack-cli.mjs
      - name: Pure offline portability and refusal tests
        run: node --test tests/sovereignty-r3-portable.test.mjs
